<div
  class="preview_overlay"
  [class.preview_overlay--ready]="isReady()"
  (click)="close()"
>
  <section #dialog class="preview_overlay__dialog" role="dialog" aria-modal="true"
    aria-labelledby="preview-overlay-title" tabindex="-1" (click)="$event.stopPropagation()">

    <div class="close_button_area">
      <button class="preview_overlay__close" type="button" aria-label="Close project preview"
        (click)="close()"></button>
    </div>

    <div class="content">
      <section class="preview_overlay__left">
        <header>
          <h1>{{ project().id }}</h1>
          <h2 id="preview_overlay__title">{{ project().title }}</h2>
        </header>
        <section class="preview_overlay__description">
          <p class="preview_overlay__description__what_is_this_project_about">What is this project about?</p>
          <p class="preview_overlay__description__text">{{ project().description }}</p>

          <section class="preview_overlay__description__using">
            <div class="preview_overlay__description__using_tech">
              @for (item of project().using; track $index) {
                <div class="preview_overlay__description__using_tech__item">
                  <img src="icon/overlay/{{ item }}.png" alt="{{ item }} icon">
                  <p>{{ item }}</p>
                </div>
              }
            </div>
          </section>
        </section>

        <section class="preview_overlay__actions">
          <button type="button"><span>Github</span></button>
          <button type="button"><span>Live Demo</span></button>
        </section>
      </section>

      <section class="preview_overlay__dialog__right">
        <img #projectImage class="preview_overlay__project-image" [src]="project().image" [alt]="project().alt">
      </section>
    </div>

    <div class="forward_button__area">
      <button class="forward_button" type="button" aria-label="Next project">
        <span>next project</span><img src="icon/overlay/arrow_forward.png" alt="Arrow forward icon">
      </button>
    </div>
    

  </section>
</div>
