<figure id="aboutMe" class="about_me">
  <div class="about_me__img-container">
    <img class="about_me__img" src="img/4ergert-500kb.png" [alt]="i18n.translate('about.portrait')">
  </div>

  <div class="who_i_am">
    <p class="who_i_am__title">{{ i18n.translate('about.who') }}</p>
    <figcaption>
      <h2>{{ i18n.translate('about.title') }}</h2>
      <p>
        {{ i18n.translate('about.intro') }}<br><br>
        {{ i18n.translate('about.description') }}
      </p>
      <section class="about_me__highlights">
        <div>
          <img src="icon/basedin-icon.png" alt="" width="24" height="24"><span>{{ i18n.translate('about.location') }}</span>
        </div>
        <div>
          <img src="icon/about-me-highlight-icon.png" alt="" width="24" height="24"><span>{{ i18n.translate('about.highlightLearning') }}</span>
        </div>
        <div>
          <img src="icon/check-star-icon.png" alt="" width="24" height="24"><span>{{ i18n.translate('about.highlightProblemSolving') }}</span>
        </div>

      </section>
    </figcaption>
  </div>
</figure>
