<section class="references" aria-labelledby="references-heading">
  <header class="references__header">
    <p id="references-heading">{{ i18n.translate('references.heading') }}</p>
  </header>

  <div class="references__viewport"
    (pointerdown)="onSwipeStart($event)"
    (pointerup)="onSwipeEnd($event)"
    (pointercancel)="onSwipeCancel($event)"
    (lostpointercapture)="onSwipeCancel($event)">
    <div class="references__track">
      @for (reference of references; track $index) {
        <article
          class="references__card"
          [class.references__card--active]="$index === activeIndex()"
          [class.references__card--left]="cardOffset($index) === -1"
          [class.references__card--right]="cardOffset($index) === 1"
          [class.references__card--hidden]="!isVisibleCard($index)"
          [attr.aria-hidden]="!isVisibleCard($index) ? 'true' : null"
          [style.transform]="cardTransform($index)"
        >
          @if ($index === activeIndex()) {
            <img class="references__quote-mark" src="img/66.png" alt="" width="90" height="64">
          }
          <p>{{ reference.quote[i18n.language()] }}</p>
          <footer>
            <span></span>
            <small>{{ reference.author[i18n.language()] }} - {{ reference.role[i18n.language()] }}</small>
          </footer>
        </article>
      }
    </div>
  </div>

  <div class="references__controls">
    <button class="references__control--previous" type="button" [attr.aria-label]="i18n.translate('references.previous')" (click)="previous()">&larr;</button>
    @for (reference of references; track $index) {
      <button
        type="button"
        class="references__dot"
        [class.references__dot--active]="$index === activeIndex()"
        [attr.aria-label]="i18n.translate('references.show') + ' ' + ($index + 1)"
        [attr.aria-current]="$index === activeIndex() ? 'true' : null"
        (click)="select($index)"
      ></button>
    }
    <button class="references__control--next" type="button" [attr.aria-label]="i18n.translate('references.next')" (click)="next()">&rarr;</button>
  </div>
</section>
